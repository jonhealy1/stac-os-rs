[package]
name = "stac-os-rs"
version = "0.7.0"
edition = "2021"

[dependencies]
# Web Framework & Tokio Runtime
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "cors", "trace"] }

# Data Modeling & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
url = "2.5"

# STAC Ecosystem (Types & DTOs)
stac = "0.17.7"


# OpenSearch Backend
opensearch = { version = "2.4.0", default-features = false, features = ["rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
geojson = "1.0.0"
cql2 = "0.5.5"
json-patch = "4.2.0"
base64 = "0.22"
jiff = "0.2.38"
utoipa = "6"
indexmap = { version = "2.14.2", features = ["serde"] }
chrono = "0.4.45"
stac-validate = "0.6.15"
futures-util = "0.3.34"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
