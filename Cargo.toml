[package]
name = "stac-os-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework & Tokio Runtime
axum = "0.8"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "cors", "trace"] }

# Data Modeling & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"

# STAC Ecosystem (Types & DTOs)
stac = "0.14"
stac-api = "0.8"

# OpenSearch Backend
opensearch = { version = "2.4.0", default-features = false, features = ["rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
geojson = "0.24.2"
cql2 = "0.4.2"
json-patch = "4.2.0"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
