services:
  api:
    build: .
    container_name: stac-os-api
    ports:
      - "3000:3000"
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      ENABLE_TRANSACTIONS_EXTENSIONS: "true"
    depends_on:
      opensearch:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: stac-os-opensearch
    environment:
      - cluster.name=stac-os-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      # Integration tests spin up ~4 indices each (it-* prefix); bare
      # `cargo test` leaks them between `make test*` sweeps — keep the
      # default-1000 shard cap from starving dev runs.
      - cluster.max_shards_per_node=3000
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600" # Performance Analyzer
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: stac-os-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  opensearch-data:
